<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f4ec;--fg:#1a1916;--mut:#6b675d;--line:#ddd8c9;--card:#fffdf7;--acc:#b86e00;--acc2:#9a4f10;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f7f4ec;--fg:#1a1916;--mut:#6b675d;--line:#ddd8c9;--card:#fffdf7;--acc:#b86e00;--acc2:#9a4f10}
:root[data-theme="dark"]{--bg:#f7f4ec;--fg:#1a1916;--mut:#6b675d;--line:#ddd8c9;--card:#fffdf7;--acc:#b86e00;--acc2:#9a4f10}
*{box-sizing:border-box}html{scroll-behavior:smooth;height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 Inter,system-ui,sans-serif}
h1,h2,h3,.disp{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.02em;line-height:1.05;margin:0}
a{color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px max(5vw,calc((100vw - 1240px)/2 + 5vw));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header b{font-family:"Space Grotesk",Inter,sans-serif;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;gap:18px;font-size:13px;overflow-x:auto}
nav a{text-decoration:none;color:var(--mut);white-space:nowrap}nav a:hover{color:var(--acc)}
section{padding:90px 5vw;border-bottom:1px solid var(--line);max-width:1240px;margin:auto}
.num{font:500 12px "Space Grotesk",Inter,sans-serif;color:var(--acc);letter-spacing:.2em;text-transform:uppercase;margin-bottom:18px;display:block}
.hero{min-height:88vh;display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:clamp(44px,11vw,128px);font-weight:700}
.hero h1 em{font-style:normal;color:var(--acc)}
.hero p{color:var(--mut);max-width:560px;font-size:18px;margin:22px 0 28px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:12px 22px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--fg);font:500 14px Inter;cursor:pointer;text-decoration:none}
.btn.p{background:var(--acc);color:#111;border-color:var(--acc)}.btn:hover{border-color:var(--acc)}
h2{font-size:clamp(30px,5vw,54px);margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.card h3{font-size:20px;margin-bottom:8px}.card p{margin:0;color:var(--mut);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:7px 15px;border:1px solid var(--line);border-radius:999px;font-size:14px}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.qual{list-style:none;padding:0;margin:0}
.qual li{padding:16px 0;border-top:1px solid var(--line);display:flex;gap:16px}
.qual li::before{content:"✦";color:var(--acc)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:30px}
.facts div{border-top:1px solid var(--line);padding-top:10px;font-size:14px;color:var(--mut)}.facts b{display:block;color:var(--fg);font-size:16px}
.rev-head{display:flex;gap:30px;align-items:baseline;flex-wrap:wrap;margin-bottom:26px}
.avg{font:700 64px "Space Grotesk",Inter,sans-serif;color:var(--acc)}
.stars{color:var(--acc);letter-spacing:2px}
.rev{margin-bottom:12px}.rev .meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mut);margin-bottom:8px;flex-wrap:wrap}
.rev p{color:var(--fg);white-space:pre-wrap}
form,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:26px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
input,textarea,select{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font:15px Inter}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.row{grid-template-columns:1fr}}
.rate{display:flex;gap:4px}.rate button{background:none;border:0;font-size:30px;color:var(--line);cursor:pointer;padding:0}.rate button.on{color:var(--acc)}
.note{font-size:13px;color:var(--mut);margin-top:10px}
.hide{display:none!important}
footer{padding:40px 5vw 100px;color:var(--mut);font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;max-width:1240px;margin:auto}
.pgbtn{font:500 13px "Space Grotesk",Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;background:none;border:1px solid var(--line);color:var(--fg);padding:8px 18px;border-radius:999px;cursor:pointer;transition:.25s}.pgbtn:hover{border-color:var(--acc);color:var(--acc)}
.bar{position:fixed;left:0;top:0;height:3px;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));z-index:40}
.cnt{position:fixed;right:5vw;bottom:calc(18px + env(safe-area-inset-bottom,0px));font:500 13px "Space Grotesk",Inter,sans-serif;letter-spacing:.15em;color:var(--mut);z-index:6}
.glow{position:fixed;width:460px;height:460px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 14%,transparent),transparent 65%);transform:translate(-50%,-50%);left:-999px;top:-999px;z-index:0;transition:left .15s,top .15s}
.ovl{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:0 8vw;opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s}
.ovl.open{opacity:1;visibility:visible}
.ovl a{display:block;font:700 clamp(22px,4.2vw,42px)/1.3 "Space Grotesk",Inter,sans-serif;text-decoration:none;opacity:0;transform:translateY(50px);transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .7s,color .2s,padding .3s}
.ovl.open a{opacity:1;transform:none}.ovl a:hover{color:var(--acc);padding-left:14px}
.ovl a small{font:500 12px "Space Grotesk",Inter,sans-serif;color:var(--acc);margin-right:16px;letter-spacing:.2em;vertical-align:middle}
.ovl .x{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));right:5vw}
@keyframes up{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:none}}
.hero>*{animation:up 1s cubic-bezier(.2,.8,.2,1) both}.hero>:nth-child(2){animation-delay:.15s}.hero>:nth-child(3){animation-delay:.3s}.hero>:nth-child(4){animation-delay:.45s}
@keyframes sh{to{background-position:200% 0}}
.hero h1 em{background:linear-gradient(90deg,var(--acc),var(--acc2),var(--acc));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:sh 4s linear infinite}
.rv{opacity:0;transform:translateY(36px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1),border-color .3s}
.rv.in{opacity:1;transform:none}
.card.rv.in:hover{transform:translateY(-6px);border-color:var(--acc)}
.chip{transition:.25s}.chip:hover{transform:translateY(-3px)}
.marq{overflow:hidden;border-bottom:1px solid var(--line);padding:20px 0}
.mtrack{display:flex;gap:40px;width:max-content;animation:mq 32s linear infinite;font:700 clamp(22px,4vw,38px) "Space Grotesk",Inter,sans-serif;text-transform:uppercase;color:var(--mut)}
.mtrack span::after{content:"✦";color:var(--acc);margin-left:40px}.marq:hover .mtrack{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
.intro{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform 1s cubic-bezier(.77,0,.18,1)}.intro.go{transform:translateY(-100%)}
.intro h2{margin:0;font-size:clamp(38px,11vw,96px);text-align:center}.intro h2 .w{display:block}
.intro h2 span{display:inline-block;opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
.intro h2 .w:last-child span{color:var(--acc)}
.intro .ln{height:2px;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));margin-top:22px;animation:ln 1.6s .3s ease forwards}
@keyframes ln{to{width:min(260px,50vw)}}

.hero>*{animation-play-state:paused}body.ready .hero>*{animation-play-state:running}
body:not(.ready){overflow:hidden}

.wab:hover{transform:scale(1.1)}.wab.hide{display:none}

.gi.vid{background:#000}
.gi.vid.yt .ph{aspect-ratio:16/9}
.gi.vid.up .ph{aspect-ratio:9/16;max-height:520px}
.gi.vid .ph{width:100%;display:block;object-fit:cover;background:linear-gradient(135deg,#1c1c1a,#0e0e0e)}
.gi .play{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:color-mix(in srgb,var(--acc) 92%,transparent);display:flex;align-items:center;justify-content:center;transition:transform .3s;box-shadow:0 6px 24px rgba(0,0,0,.45)}
.gi .play::before{content:"";margin-left:5px;border-left:18px solid #111;border-top:11px solid transparent;border-bottom:11px solid transparent}
.gi.vid:hover .play{transform:scale(1.12)}
.gi .tag{position:absolute;top:10px;left:10px;font:500 12px "Space Grotesk",Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:4px 10px}
.gfil{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.gfil button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:7px 16px;font:500 13px Inter,sans-serif;cursor:pointer;transition:.2s}
.gfil button.on{background:var(--acc);color:#111;border-color:var(--acc)}
html{overflow-x:clip}
.hero{position:relative}
.herobg{position:absolute;top:0;bottom:0;left:50%;margin-left:-50vw;width:100vw;z-index:-1;background-size:cover;background-position:center;display:none}
.herobg.on{display:block}
.abwrap{display:flex;gap:34px;align-items:flex-start;flex-wrap:wrap}
.portrait{width:min(260px,100%);aspect-ratio:3/4;object-fit:cover;border-radius:16px;border:1px solid var(--line)}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}.sw button.on{border-color:var(--fg)}
.sw input[type=color]{width:46px;height:34px;padding:2px;border-radius:8px;cursor:pointer}
.secrow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.secrow span{flex:1}.secrow button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer;font:13px Inter,sans-serif}
.secrow button:disabled{opacity:.3;cursor:default}
.cbody{max-width:720px;color:var(--mut);font-size:18px;white-space:pre-wrap}
.pv{display:block;max-width:220px;max-height:160px;border-radius:10px;margin:6px 0 10px}
.fab{position:fixed;left:5vw;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--acc);color:#111;border:0;border-radius:999px;padding:10px 18px;font:500 13px Inter,sans-serif;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.35)}
</style>

about:"I'm Dhammika, a licensed National Tourist Guide Lecturer registered with Sri Lanka Tourism. I guide English and Russian speaking travellers across the whole island, from ancient cities and tea country to beaches and wildlife, and I shape every route around you.",
facts:"Languages | English · Russian\nLicence | N-1246\nCoverage | All island\nValid | 2026 – 2027",
places:"Sigiriya Rock Fortress | heritage | UNESCO World Heritage. A 5th-century royal fortress rising out of the jungle, with ancient frescoes, the Mirror Wall and the Lion Gate. Best climbed early.\nKandy & the Temple of the Tooth | heritage | The last royal capital in the hills and home of the sacred Tooth Relic, with a lake, botanical gardens and traditional dance.\nGalle Fort | heritage | UNESCO World Heritage. A Dutch-era fort town by the sea with cobbled lanes, ramparts, cafés and sunsets.\nElla & the Scenic Train | hills | Ride the famous hill-country train, then walk to the Nine Arch Bridge and Little Adam's Peak.\nYala National Park | wildlife | Jeep safari in a park known for leopards, with elephants, crocodiles and rich birdlife.\nMirissa & Whale Watching | coast | A palm-fringed beach with relaxed bars and boat trips to see whales in season (roughly November to April).\nDambulla Cave Temple | heritage | UNESCO World Heritage. Caves painted floor to ceiling, filled with Buddha statues and vivid murals.\nNuwara Eliya & Tea Country | hills | Cool, misty hills with colonial-era charm, rolling tea estates and a visit to a working tea factory.\nAlagalla & Kegalle | gem | Cave viewpoints, valley panoramas and waterfalls away from the crowds, in the Kegalle hills.\nPolonnaruwa | heritage | UNESCO World Heritage. The medieval capital with palace ruins and the rock-carved Buddhas of Gal Vihara, best explored by bicycle.\nAnuradhapura & Mihintale | heritage | UNESCO World Heritage. Sri Lanka's first great capital, with the sacred Bodhi tree and giant stupas, plus the hill where Buddhism arrived.\nPidurangala Rock | heritage | A sunrise hike past a temple to the best view of Sigiriya.\nHorton Plains & World's End | hills | A dawn walk across a misty highland plateau to a dramatic cliff edge.\nUdawalawe National Park | wildlife | Open grassland where herds of elephants are easy to see.\nMinneriya & Kaudulla | wildlife | Seasonal elephant gatherings by the lakes, easy to combine with Sigiriya.\nUnawatuna & Southern Beaches | coast | Calm bays for swimming and snorkelling, close to Galle Fort.",
packs:"Cultural Triangle | 3 days | Dambulla, Sigiriya and Polonnaruwa, with an optional elephant safari or Anuradhapura.\nHill Country & Tea | 3 days | Kandy, Nuwara Eliya, a tea factory and the scenic train ride to Ella.\nSouth Coast & Safari | 4 days | Galle Fort, beach time in Mirissa and a Yala safari, with whale watching in season.\nClassic Sri Lanka | 7–10 days | Culture, hills, wildlife and coast in one smooth route, paced to suit you.\nAlagalla Day Trip | 1 day | Caves, viewpoints and waterfalls in the Kegalle hills, off the usual tourist trail.",

function resize(file,max){return new Promise(function(res,rej){
 var u=URL.createObjectURL(file),im=new Image();
 im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
  c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
  c.toBlob(function(b){b?res(b):rej(new Error("encode"))},"image/jpeg",.82)};
 im.onerror=function(){URL.revokeObjectURL(u);rej(new Error("decode"))};im.src=u})}

function ytId(u){

function videoPoster(file){return new Promise(function(res){
 var u=URL.createObjectURL(file),v=document.createElement("video"),done=false;
 function fin(b){if(done)return;done=true;URL.revokeObjectURL(u);res(b)}
 v.muted=true;v.playsInline=true;v.preload="auto";v.src=u;
 v.onloadeddata=function(){try{v.currentTime=Math.min(1,(v.duration||2)/2)}catch(e){fin(null)}};
 v.onseeked=function(){try{var sc=Math.min(1,900/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement("canvas");
  c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);c.getContext("2d").drawImage(v,0,0,c.width,c.height);
  c.toBlob(function(b){fin(b)},"image/jpeg",.8)}catch(e){fin(null)}};

})}
